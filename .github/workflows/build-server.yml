name: Build Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same Ubuntu release as the Pi, so the binary's glibc matches.
    runs-on: ubuntu-26.04-arm
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          cache: 'gradle'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./gradlew nativeCompile --no-daemon

      # tar keeps the executable bit, which zipped artifacts drop.
      - name: Package artifact
        run: tar -czf "server-${GITHUB_SHA}.tar.gz" -C build/native/nativeCompile yong-drive-server

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: server/server-${{ github.sha }}.tar.gz
          archive: false
          retention-days: 14
          if-no-files-found: error

      # The Pi still pulls the rolling `latest` release; drop the next two steps once the
      # deploy dashboard deploys from the artifact (docs/deploy.md §6).
      - name: Rename binary
        run: |
          mv build/native/nativeCompile/yong-drive-server \
             yong-drive-server-linux-arm64

      - name: Publish rolling release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: |
            Auto-built from `${{ github.sha }}` on ${{ github.ref_name }}.
          files: server/yong-drive-server-linux-arm64
          make_latest: 'true'
